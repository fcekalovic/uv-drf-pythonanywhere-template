[project]
name = "uv-drf-pythonanywhere-template"
version = "0.1.0"
description = "Django + DRF backend template, managed with uv and deployed on PythonAnywhere"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django~=5.2",
    "djangorestframework",
    "django-environ",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
